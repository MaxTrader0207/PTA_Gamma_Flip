name: 更新 PTA Gamma Flip 資料
# 首次執行或 data/history.json 不存在時會自動往回補 45 天

on:
  schedule:
    # 北京／台北時間週一至週五 16:37、17:13、18:07（鄭商所約 15:30 後公布當日行情）
    - cron: "37 8 * * 1-5"
    - cron: "13 9 * * 1-5"
    - cron: "7 10 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "往回抓幾個日曆天"
        default: "14"
  push:
    paths:
      - "scripts/pta_gex.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: pta-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 抓取鄭商所資料並計算 Gamma Flip
        run: |
          DAYS="${{ github.event.inputs.days }}"
          if [ -z "$DAYS" ]; then
            if [ -f data/history.json ]; then DAYS=14; else DAYS=45; fi
          fi
          python scripts/pta_gex.py --days "$DAYS"
      - name: 提交資料
        run: |
          git config user.name "pta-bot"
          git config user.email "pta-bot@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "沒有新資料"; exit 0; fi
          git commit -m "data: PTA $(TZ=Asia/Shanghai date +%F)"
          git push
